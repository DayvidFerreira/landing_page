<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brenda Ricci | Esteticista Cosmetóloga em Aracruz</title>
<meta name="description" content="Tratamentos estéticos personalizados em Aracruz, ES. Agende pelo WhatsApp.">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Jost:wght@300;500&family=Tenor+Sans&display=swap" rel="stylesheet">
<style>
/* Cores e fontes da marca */
:root{--fundo:#FBF6F6;--rose:#F3DDE1;--destaque:#8E4E5B;--texto:#3B2A2D}
body{margin:0;background:var(--fundo);color:var(--texto);font:300 17px/1.6 'Jost',sans-serif}
.box{max-width:1100px;margin:auto;padding:0 24px}
header .box{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding:20px 24px}
.logo{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit}
.logo img{height:56px}
.nome{font-family:'Tenor Sans';font-size:20px;letter-spacing:.1em}
.sub{font-size:9px;letter-spacing:.3em;color:var(--destaque)}
h1,h2{font-family:'Cormorant Garamond',serif;font-weight:300}
h1{font-size:clamp(40px,6vw,62px);line-height:1.1}
section{padding:80px 0}
.btn{display:inline-block;background:var(--destaque);color:#fff;padding:14px 28px;border-radius:99px;text-decoration:none;letter-spacing:.1em;text-transform:uppercase;font-size:14px}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:#fff;border:1px solid #EEDDE0;padding:28px;border-radius:4px}
.contato{background:var(--texto);color:var(--fundo)}
</style>
</head>
<body>
<header><div class="box">
  <a class="logo" href="#"><img src="br-simbolo.png" alt="">
    <span><div class="nome">BRENDA RICCI</div><div class="sub">ESTETICISTA COSMETÓLOGA</div></span></a>
  <a class="btn" href="#" data-wa>Agendar</a>
</div></header>

<section><div class="box">
  <h1>Cuidado que realça a sua <em>beleza natural</em>.</h1>
  <p>[Frase sobre o atendimento]</p>
  <a class="btn" href="#" data-wa>Agendar pelo WhatsApp</a>
</div></section>

<section style="background:#fff"><div class="box">
  <h2>Serviços</h2>
  <div class="grade">
    <!-- Copie este bloco para cada serviço -->
    <div class="card"><h3>[Serviço]</h3><p>[Descrição]</p><p><b>a partir de R$ [valor]</b></p>
      <a class="btn" href="#" data-wa="[Serviço]">Agendar</a></div>
  </div>
</div></section>

<section class="contato"><div class="box">
  <h2>Contato</h2>
  <p>[Endereço] · Aracruz, ES<br>[Horários]</p>
  <a class="btn" href="#" data-wa style="background:#fff;color:var(--texto)">Falar no WhatsApp</a>
</div></section>

<script>
// Troque pelo número com 55 + DDD, só números
const numero = "55XXXXXXXXXXX";
// Todo botão com data-wa abre o WhatsApp com a mensagem pronta
document.querySelectorAll("[data-wa]").forEach(b => {
  const servico = b.dataset.wa;
  const msg = servico ? `Olá, Brenda! Quero agendar: ${servico}.` : "Olá, Brenda! Gostaria de agendar um horário.";
  b.href = `https://wa.me/${numero}?text=${encodeURIComponent(msg)}`;
  b.target = "_blank";
});
</script>
</body>
</html>
